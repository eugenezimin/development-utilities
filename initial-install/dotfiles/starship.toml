# Starship prompt, modelled on the Powerlevel10k "lean" layout from ~/.config/zsh/.p10k.zsh:
#   line 1: [user@host over SSH] path, git        right side: status, duration, jobs, project info, time
#   line 2: ❯
#
# Path: parent folders are cut to one letter, the repo root (bold, underlined) and the
# current folder stay whole: ~/D/development-utilities/i/d/z/conf.d
# The parts come from _prompt_dir in ~/.config/zsh/prompt.zsh via PROMPT_DIR_* variables;
# starship's own directory module can't abbreviate around the repo root.
#
# Git: ⇡ahead ⇣behind  =conflicted +staged !modified »renamed ✘deleted ?untracked *stashed,
# then lines +added -removed. A detached HEAD shows (hash tag), a rebase/merge shows its progress.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 1000   # java -version and friends can be slow on the first run

format = """($username$hostname )\
${env_var.PROMPT_DIR_PRE}${env_var.PROMPT_DIR_ROOT}${env_var.PROMPT_DIR_SUB}${env_var.PROMPT_DIR_RO} \
$git_branch$git_commit$git_state$git_status$git_metrics
$character"""

right_format = """$status$cmd_duration$jobs$direnv\
$package$python$nodejs$golang$rust$java$swift$c$cpp$docker_context$aws$kubernetes$time"""

# ── Path (see header) ─────────────────────────────────────────────────────────
[env_var.PROMPT_DIR_PRE]
format = "[$env_value]($style)"
style = "dimmed 31"

[env_var.PROMPT_DIR_ROOT]
format = "[$env_value]($style)"
style = "bold underline 31"

[env_var.PROMPT_DIR_SUB]
format = "[$env_value]($style)"
style = "bold 31"

[env_var.PROMPT_DIR_RO]
format = "[$env_value]($style)"
style = "160"

# ── Only over SSH or as root ──────────────────────────────────────────────────
[username]
format = "[$user]($style)"
style_user = "bold 178"
style_root = "bold 196"

[hostname]
ssh_only = true
format = "[@$hostname]($style)"
style = "bold 178"

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "76"
truncation_length = 32
truncation_symbol = "…"
only_attached = true    # detached HEAD is shown by git_commit instead

[git_commit]
format = "on [\\($hash$tag\\)]($style) "
style = "245"
only_detached = true
tag_disabled = false
tag_symbol = "  "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold 196"

[git_status]
format = "($ahead_behind$conflicted$staged$modified$renamed$deleted$untracked$stashed)"
ahead = "[⇡${count}](76) "
behind = "[⇣${count}](76) "
diverged = "[⇡${ahead_count}⇣${behind_count}](76) "
conflicted = "[=${count}](196) "
staged = "[+${count}](178) "
modified = "[!${count}](178) "
renamed = "[»${count}](178) "
deleted = "[✘${count}](160) "
untracked = "[?${count}](39) "
stashed = "[*${count}](66) "

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "76"
deleted_style = "160"
ignore_submodules = true

[character]
success_symbol = "[❯](76)"
error_symbol = "[❯](196)"
vimcmd_symbol = "[❮](76)"

# ── Right side ────────────────────────────────────────────────────────────────
[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘"
style = "160"

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "101"

[jobs]
format = "[$symbol$number]($style) "
symbol = "⚙"
style = "70"

[direnv]
disabled = false
format = "[$symbol$loaded/$allowed]($style) "
style = "178"

# Project version from Cargo.toml, package.json, pyproject.toml, …
[package]
format = "[$symbol$version]($style) "
symbol = "󰏗 "
style = "178"

[python]
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
symbol = " "
style = "37"

[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "70"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "37"

[rust]
format = "[$symbol($version )]($style)"
symbol = "󱘗 "
style = "166"

[java]
format = "[$symbol($version )]($style)"
symbol = " "
style = "32"

[swift]
format = "[$symbol($version )]($style)"
symbol = " "
style = "202"

[c]
format = "[$symbol($version )]($style)"
symbol = " "
style = "67"

[cpp]
format = "[$symbol($version )]($style)"
symbol = " "
style = "67"

# Only in folders with a Dockerfile/compose file, and never for the "default" context
[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
style = "33"

[aws]
disabled = true   # the motd greeting shows it; p10k only showed this while typing aws commands
format = "[$symbol($profile )(\\($region\\) )]($style)"
symbol = " "
style = "208"

[kubernetes]
disabled = true   # the motd greeting shows it
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "134"

[time]
disabled = false
format = "at [$time]($style)"
time_format = "%I:%M:%S %p"
style = "66"
