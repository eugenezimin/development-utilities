# Package manifest for install-all-macos.sh
#
# Format:  category | type | id | description | default
#   type     formula | cask | mas | manual
#   id       Homebrew formula/cask token, App Store ID (mas), or a name (manual)
#   default  on  = preselected in the checklist
#            off = listed but not preselected
#            -   = manual items (shown as reminders, never installed)
#
# Categories are shown in the order they first appear. "App Store" and "Fonts"
# are offered in their own steps; "Manual" items appear in the final summary.
# Descriptions must not contain commas (gum uses them as a separator).
#
# Refresh from the current Mac with: ./install-all-macos.sh --snapshot

